<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Видеоинтервью Сапармурат</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header class="header">
      <h1>Видеоинтервью Сапармурат</h1>
      <p>Простой видеозвонок один на один</p>
    </header>

    <section class="videos" aria-label="Окна видеозвонка">
      <div class="video-card">
        <video id="remoteVideo" autoplay playsinline></video>
        <span class="video-label">Собеседник</span>
      </div>
      <div class="video-card">
        <video id="localVideo" autoplay muted playsinline></video>
        <span class="video-label">Вы</span>
      </div>
    </section>

    <section class="controls">
      <p id="status" role="status">Нажмите «Начать звонок», чтобы подключиться</p>
      <div class="buttons">
        <button id="startButton" type="button">Начать звонок</button>
        <button id="hangupButton" class="secondary" type="button" disabled>Завершить</button>
      </div>
    </section>
    <p class="note">Разрешите доступ к камере и микрофону. Откройте эту страницу в двух окнах, чтобы проверить звонок.</p>
  </main>
  <script src="app.js"></script>
</body>
</html>
